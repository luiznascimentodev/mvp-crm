version: 2
updates:
  # Dependências raiz do monorepo
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'security'
    groups:
      patch-updates:
        update-types:
          - 'patch'
      minor-updates:
        update-types:
          - 'minor'

  # Dependências do backend (server/)
  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'backend'
    groups:
      nestjs-updates:
        patterns:
          - '@nestjs/*'
        update-types:
          - 'minor'
          - 'patch'
      patch-updates:
        update-types:
          - 'patch'

  # Dependências do frontend (web/)
  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      react-updates:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
        update-types:
          - 'minor'
          - 'patch'
      patch-updates:
        update-types:
          - 'patch'
